# Daily "right now vs normal": NASA FIRMS's keyless 7-day NOAA-20 file -> web/data/nrt.json (tools/nrt_snapshot.py).
# No key, no login. The normals (data/nrt/*_daily.json, *_static.json) are built once from the archive by
# tools/nrt_normal.py and committed; this job only reads the live file.
name: Live fire snapshot
on:
  schedule: [{ cron: "30 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Country outlines (Natural Earth, checksums as in pipeline/outline.py)
        run: |
          mkdir -p data/raw/boundaries/ne10m_be165336bb
          curl -sSL -o data/raw/boundaries/ne_10m_admin_0_countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson
          for e in shp shx dbf; do curl -sSL -o data/raw/boundaries/ne10m_be165336bb/ne_10m_admin_0_countries.$e https://raw.githubusercontent.com/nvkelso/natural-earth-vector/be165336bbc6d3c28fb75348fa223339308b7742/10m_cultural/ne_10m_admin_0_countries.$e; done
          echo "239eec57ac17f100a11e2536cffc56752c318b50ae765b0918ff7aab4ce8f255  data/raw/boundaries/ne_10m_admin_0_countries.geojson" | sha256sum -c
      - run: python tools/nrt_snapshot.py
      - name: Commit the snapshot
        run: |
          git config user.name "cedrus-bot"; git config user.email "actions@users.noreply.github.com"
          git add web/data/nrt.json
          git diff --cached --quiet || git commit -m "Live fire snapshot $(date -u +%F)"
          git push
